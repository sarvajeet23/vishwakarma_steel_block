name: "Build & Release"

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v3

      # Set up Java 17
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build APK with tree-shaking disabled for icons
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # Publish artifacts as a GitHub Release
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*.apk"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.SARVAJEET }}

  build-ios:
    name: Build IPA
    runs-on: macos-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v3

      # Set up Flutter on macOS
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Ensure Podfile exists and update platform version
      - name: Ensure Podfile exists and update platform version
        run: |
          # Check if Podfile exists
          if [ ! -f ios/Podfile ]; then
            echo "Creating Podfile"
            flutter create . --org com.vishwakarma.steel
          fi
          # Update the platform version and frameworks
          echo "platform :ios, '12.0'" >> ios/Podfile
          echo "use_frameworks!" >> ios/Podfile
          echo "workspace 'Runner.xcworkspace'" >> ios/Podfile
          cat ios/Podfile # Optional: Display the Podfile for debugging

      # Install CocoaPods for iOS dependencies
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod repo update
          pod install
          cd ..

      # Clean build artifacts and install dependencies
      - name: Clean and install dependencies
        run: |
          flutter clean
          flutter pub get

      # Build the IPA file
      - name: Build IPA
        run: flutter build ios --release --no-codesign

      # Upload IPA as an artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: app-release.ipa
          path: build/ios/iphoneos/*.ipa
