name: "Build & Release"

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v3

      # Set up Java 17
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build APK with tree-shaking disabled for icons
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # Publish artifacts as a GitHub Release
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*.apk"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.SARVAJEET }}

  build-ios:
    name: Build IPA
    runs-on: macos-latest
    steps:
      # Checkout code
      - uses: actions/checkout@v3

      # Set up Flutter (you can remove this step if you want to use the `flutter-action` setup)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      # Install CocoaPods for iOS dependencies
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          if [ ! -f ios/Podfile ]; then
            flutter create .
          fi
          cd ios && pod install && cd ..

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build the IPA file
      - name: Build IPA
        run: flutter build ios --release --no-codesign

      # Upload IPA as an artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: app-release.ipa
          path: build/ios/iphoneos/*.ipa
