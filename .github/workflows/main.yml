name: Build & Release

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest  # Use Ubuntu for Android builds

    steps:
      - uses: actions/checkout@v3

      # Set up Java (required for Flutter builds)
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Install dependencies
      - run: flutter pub get

      # Build Android APK (split per ABI)
      - run: flutter build apk --release --split-per-abi

      # Upload Android APK to GitHub Releases
      - name: Push Android APK to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*.apk"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest  # Use macOS for iOS builds

    steps:
      - uses: actions/checkout@v3

      # Set up Java (required for Flutter builds)
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Install dependencies
      - run: flutter pub get

      # Build iOS IPA (unsigned)
      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload

      # Upload iOS IPA to GitHub Releases
      - name: Push iOS IPA to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/ios/iphoneos/app.ipa"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
